    />

    <script type="text/javascript">
      // GitHub Pages has no server-side routing, so deep links (e.g. /students/juan-perez)
      // get redirected to 404.html, which forwards here with the path encoded in the query
      // string. This decodes it back into a real history entry before React Router mounts.
      // See: https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
